<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" font-family="Arial, Helvetica, sans-serif">
  <rect width="1180" height="820" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#1f4e79">UML de Casos de Uso — Módulo G3 (API aberta, sem autenticação)</text>
  <text x="20" y="54" font-size="12" fill="#555">Não existem casos de uso de Login/Password/RBAC — o módulo é uma API aberta.</text>

  <!-- Actors -->
  <g stroke="#1a1a1a" stroke-width="1.4" fill="none">
    <g transform="translate(90,180)"><circle r="14" fill="#fff"/></g>
    <line x1="90" y1="194" x2="90" y2="240"/>
    <line x1="90" y1="240" x2="66" y2="276"/>
    <line x1="90" y1="240" x2="114" y2="276"/>
  </g>
  <text x="90" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Professor</text>
  <text x="90" y="316" font-size="10.5" text-anchor="middle" fill="#555">lança notas · horários · pauta</text>

  <g stroke="#1a1a1a" stroke-width="1.4" fill="none">
    <g transform="translate(90,390)"><circle r="14" fill="#fff"/></g>
    <line x1="90" y1="404" x2="90" y2="450"/>
    <line x1="90" y1="450" x2="66" y2="486"/>
    <line x1="90" y1="450" x2="114" y2="486"/>
  </g>
  <text x="90" y="512" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Secretaria</text>
  <text x="90" y="528" font-size="10.5" text-anchor="middle" fill="#555">cria/gere avaliações e horários</text>

  <g stroke="#1a1a1a" stroke-width="1.4" fill="none">
    <g transform="translate(1090,280)"><circle r="14" fill="#fff"/></g>
    <line x1="1090" y1="294" x2="1090" y2="340"/>
    <line x1="1090" y1="340" x2="1066" y2="376"/>
    <line x1="1090" y1="340" x2="1114" y2="376"/>
  </g>
  <text x="1090" y="400" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Aluno</text>
  <text x="1090" y="416" font-size="10.5" text-anchor="middle" fill="#555">consulta resultados/média</text>

  <!-- System boundary -->
  <rect x="210" y="90" width="860" height="690" rx="14" fill="#fbfdff" stroke="#1f4e79" stroke-width="1.6" stroke-dasharray="8 4"/>
  <text x="640" y="118" font-size="14" font-weight="bold" fill="#1f4e79" text-anchor="middle">MÓDULO G3 — Avaliações e Horários (API aberta)</text>

  <!-- UC: Avaliações -->
  <g>
    <ellipse cx="360" cy="190" rx="130" ry="150" fill="#ffffff" stroke="#2e74b5"/>
    <text x="360" y="152" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f4e79">Avaliações</text>
    <text x="360" y="175" font-size="11" text-anchor="middle" fill="#1a1a1a">Consultar avaliações</text>
    <text x="360" y="197" font-size="11" text-anchor="middle" fill="#1a1a1a">Criar avaliação</text>
    <text x="360" y="219" font-size="11" text-anchor="middle" fill="#1a1a1a">Actualizar avaliação</text>
    <text x="360" y="241" font-size="11" text-anchor="middle" fill="#1a1a1a">Eliminar avaliação</text>
    <text x="360" y="258" font-size="10" text-anchor="middle" fill="#777">(só quando permitido)</text>
    <text x="360" y="285" font-size="10.5" text-anchor="middle" fill="#777">Lançar nota (por aluno)</text>
    <text x="360" y="303" font-size="10.5" text-anchor="middle" fill="#777">Actualizar nota</text>
  </g>

  <!-- UC: Horários -->
  <g>
    <ellipse cx="640" cy="190" rx="130" ry="150" fill="#ffffff" stroke="#2e74b5"/>
    <text x="640" y="152" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f4e79">Horários</text>
    <text x="640" y="175" font-size="11" text-anchor="middle" fill="#1a1a1a">Consultar horários</text>
    <text x="640" y="197" font-size="11" text-anchor="middle" fill="#1a1a1a">Criar horário</text>
    <text x="640" y="219" font-size="11" text-anchor="middle" fill="#1a1a1a">Actualizar horário</text>
    <text x="640" y="241" font-size="11" text-anchor="middle" fill="#1a1a1a">Eliminar horário</text>
    <text x="640" y="258" font-size="10" text-anchor="middle" fill="#777">(quando permitido)</text>
    <text x="640" y="285" font-size="10.5" text-anchor="middle" fill="#777">Conflito de sala/prof./</text>
    <text x="640" y="300" font-size="10.5" text-anchor="middle" fill="#777">turma → 409</text>
  </g>

  <!-- UC: Resultados / Impressão -->
  <g>
    <ellipse cx="920" cy="190" rx="130" ry="150" fill="#ffffff" stroke="#2e74b5"/>
    <text x="920" y="152" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1f4e79">Resultados</text>
    <text x="920" y="175" font-size="11" text-anchor="middle" fill="#1a1a1a">Consultar resultados</text>
    <text x="920" y="197" font-size="11" text-anchor="middle" fill="#1a1a1a">Registar resultado</text>
    <text x="920" y="219" font-size="11" text-anchor="middle" fill="#1a1a1a">(recalc. em lote)</text>
    <text x="920" y="241" font-size="11" text-anchor="middle" fill="#1a1a1a">Actualizar resultado</text>
    <text x="920" y="258" font-size="10" text-anchor="middle" fill="#777">(recalc. individual)</text>
    <text x="920" y="285" font-size="10.5" text-anchor="middle" fill="#777">Calcular média (regra ·)</text>
    <text x="920" y="300" font-size="10.5" text-anchor="middle" fill="#777">Imprimir pauta/horário</text>
  </g>

  <!-- include relation: Consultar notas refina lançar nota + recalcular -->
  <g stroke="#c00000" stroke-width="1.2" stroke-dasharray="4 3">
    <path d="M 522 268 C 560 300, 575 312, 618 318" fill="none"/>
    <path d="M 700 268 C 668 300, 665 306, 660 311" fill="none"/>
  </g>
  <text x="590" y="332" font-size="10.5" fill="#c00000" text-anchor="middle">«refinar» média/estatuto</text>

  <!-- Núcleo: regra de negócio (média ponderada) -->
  <g>
    <rect x="360" y="560" width="460" height="110" rx="8" fill="#fff8e6" stroke="#bf9000"/>
    <text x="376" y="586" font-size="12" font-weight="bold" fill="#7f6000">Regra de negócio central (G3)</text>
    <text x="376" y="610" font-size="11.5" fill="#1a1a1a">Média = (Σ nota×peso) / Σ peso   (peso &gt; 0)</text>
    <text x="376" y="630" font-size="11" fill="#1a1a1a">Status: APPROVED (≥10) · RECOVERY (≥8) · FAILED (&lt;8)</text>
    <text x="376" y="648" font-size="11" fill="#1a1a1a">IN_PROGRESS quando faltam notas · PENDING sem avaliações</text>
    <text x="376" y="664" font-size="10.5" fill="#777">Implementada em domain/evaluation.js · testes unitários</text>
  </g>

  <!-- actor associations -->
  <g stroke="#404040" stroke-width="1.4" fill="none">
    <line x1="120" y1="210" x2="228" y2="196"/>
    <line x1="120" y1="220" x2="640" y2="176"/>
    <line x1="120" y1="300" x2="360" y2="312"/>
    <line x1="940" y1="262" x2="1000" y2="252"/>
    <line x1="1090" y1="280" x2="960" y2="300"/>
    <line x1="120" y1="400" x2="360" y2="336"/>
    <line x1="120" y1="410" x2="640" y2="336"/>
  </g>

  <text x="20" y="800" font-size="10.5" fill="#555">Atores: Professor (docente da disciplina) · Secretaria (gestão académica) · Aluno (consulta). Tudo via HTTP/JSON aberto — sem login.</text>
</svg>