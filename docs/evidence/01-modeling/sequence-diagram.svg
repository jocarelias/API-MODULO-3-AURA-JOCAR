<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" font-family="Arial, Helvetica, sans-serif">
  <rect width="1180" height="820" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#1f4e79">UML de Sequência — Lançar nota (POST /api/v1/assessments/:assessmentId/grades)</text>
  <text x="20" y="54" font-size="12" fill="#555">Cliente → Router → Zod → Service → Domain → Prisma → PostgreSQL → resposta (envelope aberto).</text>

  <!-- lanes -->
  <g>
    <rect x="40"  y="70" width="170" height="36" fill="#1f4e79" rx="4"/><text x="125" y="93" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Cliente</text>
    <rect x="240" y="70" width="170" height="36" fill="#1f4e79" rx="4"/><text x="325" y="93" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Router (Express)</text>
    <rect x="440" y="70" width="150" height="36" fill="#1f4e79" rx="4"/><text x="515" y="93" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Zod (schemas)</text>
    <rect x="620" y="70" width="190" height="36" fill="#1f4e79" rx="4"/><text x="715" y="93" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Service</text>
    <rect x="840" y="70" width="150" height="36" fill="#1f4e79" rx="4"/><text x="915" y="93" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Domain</text>
    <rect x="1020" y="70" width="130" height="36" fill="#1f4e79" rx="4"/><text x="1085" y="93" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Prisma</text>
  </g>
  <line x1="125" y1="106" x2="125" y2="790" stroke="#9db8d2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="325" y1="106" x2="325" y2="790" stroke="#9db8d2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="515" y1="106" x2="515" y2="790" stroke="#9db8d2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="715" y1="106" x2="715" y2="790" stroke="#9db8d2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="915" y1="106" x2="915" y2="790" stroke="#9db8d2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="1085" y1="106" x2="1085" y2="790" stroke="#9db8d2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M1085 720 l0 44 l-180 -20 l0 -24 Z" fill="#eef4fb" stroke="#9db8d2"/><text x="1085" y="740" font-size="10.5" text-anchor="middle" fill="#1f4e79">PostgreSQL 16</text>

  <g stroke="#c00000" stroke-width="1.4" font-size="11">
    <line x1="125" y1="136" x2="315" y2="136"/><polygon points="315,136 305,131 305,141" fill="#c00000"/>
    <text x="140" y="128">POST /api/v1/assessments/:id/grades {studentId, score}</text>
    <line x1="325" y1="170" x2="505" y2="170"/><polygon points="505,170 495,165 495,175" fill="#c00000"/>
    <text x="340" y="162">validate(createGradeSchema, body)</text>
    <line x1="505" y1="204" x2="335" y2="204" stroke-dasharray="5 4"/><polygon points="335,204 345,199 345,209" fill="#c00000"/>
    <text x="412" y="196" text-anchor="middle">400 VALIDATION_ERROR (details) — se inválido</text>
    <line x1="325" y1="240" x2="705" y2="240"/><polygon points="705,240 695,235 695,245" fill="#c00000"/>
    <text x="340" y="232">createGrade(assessmentId, body)</text>
    <line x1="715" y1="274" x2="905" y2="274"/><polygon points="905,274 895,269 895,279" fill="#c00000"/>
    <text x="730" y="266">validateScore · validateWeight</text>
    <line x1="715" y1="308" x2="905" y2="308" stroke-dasharray="5 4"/><polygon points="905,308 895,303 895,313" fill="#c00000"/>
    <text x="730" y="300">média: weightedAverage + resolveStatus</text>
    <line x1="725" y1="342" x2="1075" y2="342"/><polygon points="1075,342 1065,337 1065,347" fill="#c00000"/>
    <text x="740" y="334">prisma.$transaction(async tx =&gt; …)</text>
    <line x1="1085" y1="376" x2="1085" y2="396"/>
    <text x="1010" y="368" text-anchor="end">INSERT grade</text>
    <text x="1010" y="384" text-anchor="end">+ UPSERT result (média/status)</text>
    <line x1="1085" y1="430" x2="735" y2="430" stroke-dasharray="5 4"/><polygon points="735,430 745,425 745,435" fill="#c00000"/>
    <text x="940" y="422" text-anchor="middle">commit (notas + resultado consistentes)</text>
    <line x1="725" y1="464" x2="335" y2="464" stroke-dasharray="5 4"/><polygon points="335,464 345,459 345,469" fill="#c00000"/>
    <text x="530" y="456" text-anchor="middle">gradeDto (serialization @smartcampus/shared-types)</text>
    <line x1="325" y1="498" x2="135" y2="498" stroke-dasharray="5 4"/><polygon points="135,498 145,493 145,503" fill="#c00000"/>
    <text x="230" y="490" text-anchor="middle">201 {data: grade, meta:{correlationId}}</text>
  </g>

  <!-- alt frame: falha -->
  <g>
    <rect x="230" y="540" width="820" height="150" rx="6" fill="#fdf5f5" stroke="#c00000" stroke-width="1.2"/>
    <text x="240" y="560" font-size="11.5" font-weight="bold" fill="#c00000">alt — qualquer passo falha (PB: rollback)</text>
    <g font-size="11" fill="#1a1a1a">
      <text x="240" y="582">• NOT_FOUND (404): assessment/aluno/matrícula inexistentes</text>
      <text x="240" y="602">• CONFLICT (409): avaliação não OPEN · nota duplicada · peso/maxScore imutável · delete bloqueado</text>
      <text x="240" y="622">• VALIDATION_ERROR (400): nota fora de [0, maxScore] · peso ≤ 0 · horário inválido</text>
      <text x="240" y="642">• P2002 do Prisma → 409 (CONFLICT) via infra/httpError.js</text>
      <text x="240" y="662">• Falha no recálculo dentro do $transaction → ROLLBACK: a nota não fica persistida (teste g3.transaction.e2e)</text>
      <text x="240" y="682">• Erro inesperado → 500 INTERNAL_ERROR (envelope {code, message, details, correlationId})</text>
    </g>
  </g>

  <text x="20" y="728" font-size="11" fill="#555">Envelope de erro: {code, message, details, correlationId} · envelope de sucesso: {data, meta:{correlationId}} · sem 401/403 (API aberta).</text>
</svg>