                code: INTERNAL_ERROR
                message: Ocorreu um erro inesperado
                details: []
                correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
  /api/v1/results/calculation-methods:
    get:
      operationId: getResultsCalculationMethods
