  /api/v1/results/calculate:
    post:
      operationId: postResultsCalculate
      tags:
        - Resultados
      summary: Calcula a nota final usando um método de cálculo flexível
      description: >-
        Motor multi-método: permite escolher entre média aritmética, ponderada percentual, soma percentual, média
        normalizada, cálculo por componentes ou cálculo personalizado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
                - items
              properties:
                method:
                  type: string
                  enum:
                    - ARITHMETIC_MEAN
                    - WEIGHTED_PERCENTAGE
                    - PERCENTAGE_SUM
                    - NORMALIZED_WEIGHTED_MEAN
                    - COMPONENT_BASED
                    - CUSTOM_WEIGHTED
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - score
                    properties:
                      assessmentId:
                        type: string
                        format: uuid
                        description: UUID da avaliação (opcional)
                      name:
                        type: string
                        minLength: 1
                      type:
                        type: string
                        enum:
                          - TESTE
                          - EXAME_NORMAL
                          - EXAME_RECURRENCIA
                      score:
                        type: number
                        minimum: 0
                      weight:
                        type: number
                        minimum: 0
                        maximum: 100
                        description: Peso percentual (0–100)
                  minLength: 1
                  description: Notas com pesos (mínimo 1 item)
                components:
                  type: array
                  items:
                    type: object
                    required:
                      - weight
                    properties:
                      id:
                        type: string
                        minLength: 1
                      assessmentId:
                        type: string
