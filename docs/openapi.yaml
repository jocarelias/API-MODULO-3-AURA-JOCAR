openapi: 3.0.0
info:
  title: Smart Campos — Módulo G3 (Avaliações e Horários)
  version: 1.0.0
  description: >-
    API autenticada (Bearer) para gestão de avaliações, notas, médias, horários, resultados e impressão de
    pautas/horários. Consome os serviços de contratos (estudantes, docentes, inscrições e financeiro) e bloqueia o
    lançamento de notas de alunos com dívida.
security:
  - BearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      tags:
        - Autenticação
      summary: Autentica um utilizador e devolve accessToken + refreshToken
      description: >-
        Público. Verifica credenciais e devolve um accessToken (Bearer, curta duração) e um refreshToken (longa duração,
        7 dias por omissão). O refreshToken é gerido com rotação e revogação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              example:
                email: aluno1@student.ucjac.ac.mz
                password: Aluno@2026
      responses:
        '200':
          description: Credenciais válidas — accessToken + refreshToken + perfil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                      expiresIn:
                        type: integer
                      refreshToken:
                        type: string
                      refreshExpiresIn:
                        type: integer
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          role:
                            type: string
                          schoolId:
                            type: string
                            format: uuid
                          name:
                            type: string
                          email:
                            type: string
                        example:
                          id: 02e95780-9708-48e6-bced-d8607a61fa5a
                          role: STUDENT
                          schoolId: f266cdec-aee4-45a5-a962-9d961a95638b
                          name: Abu Bakar Ossum
                          email: aluno1@student.ucjac.ac.mz
                    required:
                      - accessToken
                      - tokenType
                      - expiresIn
                      - refreshToken
                      - refreshExpiresIn
                      - user
                    example:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMmU5NTc4MC05NzA4LTQ4ZTZiY2VkLWQ4NjA3YTYxZmE1YSJ9.Q7x2vJ0m3sTg9pQeYb1nZ8kL4cW6rD5fH7jK0lM9nP2qR4s
                      tokenType: Bearer
                      expiresIn: 900
                      refreshToken: rt_9f2c7a41b8d64e0f9a3c5d7e1b2f4a6c8e0d2f4a6c8e0d2f4a6c8e0d2f4a6c8
                      refreshExpiresIn: 604800
                      user:
                        id: 02e95780-9708-48e6-bced-d8607a61fa5a
                        role: STUDENT
                        schoolId: f266cdec-aee4-45a5-a962-9d961a95638b
                        name: Abu Bakar Ossum
                        email: aluno1@student.ucjac.ac.mz
                  meta:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      page:
                        type: number
                      pageSize:
                        type: number
                      total:
                        type: number
                required:
                  - data
                  - meta
                example:
                  data:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMmU5NTc4MC05NzA4LTQ4ZTZiY2VkLWQ4NjA3YTYxZmE1YSJ9.Q7x2vJ0m3sTg9pQeYb1nZ8kL4cW6rD5fH7jK0lM9nP2qR4s
                    tokenType: Bearer
                    expiresIn: 900
                    refreshToken: rt_9f2c7a41b8d64e0f9a3c5d7e1b2f4a6c8e0d2f4a6c8e0d2f4a6c8e0d2f4a6c8
                    refreshExpiresIn: 604800
                    user:
                      id: 02e95780-9708-48e6-bced-d8607a61fa5a
                      role: STUDENT
                      schoolId: f266cdec-aee4-45a5-a962-9d961a95638b
                      name: Abu Bakar Ossum
                      email: aluno1@student.ucjac.ac.mz
                  meta:
                    correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
              example:
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMmU5NTc4MC05NzA4LTQ4ZTZiY2VkLWQ4NjA3YTYxZmE1YSJ9.Q7x2vJ0m3sTg9pQeYb1nZ8kL4cW6rD5fH7jK0lM9nP2qR4s
                  tokenType: Bearer
                  expiresIn: 900
                  refreshToken: rt_9f2c7a41b8d64e0f9a3c5d7e1b2f4a6c8e0d2f4a6c8e0d2f4a6c8e0d2f4a6c8
                  refreshExpiresIn: 604800
                  user:
                    id: 02e95780-9708-48e6-bced-d8607a61fa5a
                    role: STUDENT
                    schoolId: f266cdec-aee4-45a5-a962-9d961a95638b
                    name: Abu Bakar Ossum
                    email: aluno1@student.ucjac.ac.mz
                meta:
                  correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
        '400':
          description: Requisição inválida (email ou password em falta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
              example:
                code: VALIDATION_ERROR
                message: Requisição inválida (validação Zod ou regra de domínio)
                details:
                  - path: weight
                    message: Peso deve ser maior que zero
                correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
        '401':
          description: Credenciais inválidas ou utilizador inativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
              example:
                code: UNAUTHENTICATED
                message: Credenciais inválidas
                details: []
                correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
      security: []
  /api/v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      tags:
        - Autenticação
      summary: Renova a sessão (rotação de refreshToken)
      description: >-
        Público. Recebe um refreshToken válido, revoga-o e devolve um novo par accessToken + refreshToken. Reutilização
        de um refreshToken já revogado devolve 401 UNAUTHENTICATED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  minLength: 16
              example:
                refreshToken: rt_9f2c7a41b8d64e0f9a3c5d7e1b2f4a6c8e0d2f4a6c8e0d2f4a6c8e0d2f4a6c8
      responses:
        '200':
          description: Novo par de tokens (o refreshToken anterior foi revogado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                      expiresIn:
                        type: integer
                      refreshToken:
                        type: string
                      refreshExpiresIn:
                        type: integer
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          role:
                            type: string
                          schoolId:
                            type: string
                            format: uuid
                          name:
                            type: string
                          email:
                            type: string
                        example:
                          id: 02e95780-9708-48e6-bced-d8607a61fa5a
                          role: STUDENT
                          schoolId: f266cdec-aee4-45a5-a962-9d961a95638b
                          name: Abu Bakar Ossum
                          email: aluno1@student.ucjac.ac.mz
                    required:
                      - accessToken
                      - tokenType
                      - expiresIn
                      - refreshToken
                      - refreshExpiresIn
                      - user
                    example:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMmU5NTc4MC05NzA4LTQ4ZTZiY2VkLWQ4NjA3YTYxZmE1YSJ9.Q7x2vJ0m3sTg9pQeYb1nZ8kL4cW6rD5fH7jK0lM9nP2qR4s
                      tokenType: Bearer
                      expiresIn: 900
                      refreshToken: rt_9f2c7a41b8d64e0f9a3c5d7e1b2f4a6c8e0d2f4a6c8e0d2f4a6c8e0d2f4a6c8
                      refreshExpiresIn: 604800
                      user:
                        id: 02e95780-9708-48e6-bced-d8607a61fa5a
                        role: STUDENT
                        schoolId: f266cdec-aee4-45a5-a962-9d961a95638b
                        name: Abu Bakar Ossum
                        email: aluno1@student.ucjac.ac.mz
                  meta:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      page:
                        type: number
                      pageSize:
                        type: number
                      total:
                        type: number
                required:
                  - data
                  - meta
                example:
                  data:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMmU5NTc4MC05NzA4LTQ4ZTZiY2VkLWQ4NjA3YTYxZmE1YSJ9.Q7x2vJ0m3sTg9pQeYb1nZ8kL4cW6rD5fH7jK0lM9nP2qR4s
                    tokenType: Bearer
                    expiresIn: 900
                    refreshToken: rt_9f2c7a41b8d64e0f9a3c5d7e1b2f4a6c8e0d2f4a6c8e0d2f4a6c8e0d2f4a6c8
                    refreshExpiresIn: 604800
                    user:
                      id: 02e95780-9708-48e6-bced-d8607a61fa5a
                      role: STUDENT
                      schoolId: f266cdec-aee4-45a5-a962-9d961a95638b
                      name: Abu Bakar Ossum
                      email: aluno1@student.ucjac.ac.mz
                  meta:
                    correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
              example:
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMmU5NTc4MC05NzA4LTQ4ZTZiY2VkLWQ4NjA3YTYxZmE1YSJ9.Q7x2vJ0m3sTg9pQeYb1nZ8kL4cW6rD5fH7jK0lM9nP2qR4s
                  tokenType: Bearer
                  expiresIn: 900
                  refreshToken: rt_9f2c7a41b8d64e0f9a3c5d7e1b2f4a6c8e0d2f4a6c8e0d2f4a6c8e0d2f4a6c8
                  refreshExpiresIn: 604800
                  user:
                    id: 02e95780-9708-48e6-bced-d8607a61fa5a
                    role: STUDENT
                    schoolId: f266cdec-aee4-45a5-a962-9d961a95638b
                    name: Abu Bakar Ossum
                    email: aluno1@student.ucjac.ac.mz
                meta:
                  correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
        '400':
          description: Requisição inválida (refreshToken em falta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
              example:
                code: VALIDATION_ERROR
                message: Requisição inválida (validação Zod ou regra de domínio)
                details:
                  - path: weight
                    message: Peso deve ser maior que zero
                correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
        '401':
