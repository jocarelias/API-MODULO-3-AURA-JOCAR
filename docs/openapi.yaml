                rounding:
                  type: object
                  properties:
                    decimals:
                      type: integer
                      enum:
                        - 0
                        - 1
                        - 2
                  description: Precisão de arredondamento (0, 1 ou 2 casas decimais)
                minScore:
                  type: number
                  minimum: 0
                  description: Nota mínima do intervalo (padrão 0)
                maxScore:
                  type: number
                  minimum: 1
                  description: Nota máxima do intervalo (padrão 20)
                expectedTotal:
                  type: number
                  exclusiveMinimum: 0
                  description: Total esperado dos pesos (padrão 100)
                allowNormalization:
                  type: boolean
                  description: Permitir normalização de pesos
                top:
