                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
              example:
                code: UNAUTHENTICATED
                message: RefreshToken inválido ou expirado
                details: []
                correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
      security: []
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      tags:
        - Autenticação
      summary: Revoga o refreshToken (logout)
      description: Autenticado. Revoga o refreshToken indicado; pedidos posteriores com esse refreshToken devolvem 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  minLength: 16
              example:
                refreshToken: rt_9f2c7a41b8d64e0f9a3c5d7e1b2f4a6c8e0d2f4a6c8e0d2f4a6c8e0d2f4a6c8
      responses:
        '200':
          description: Sessão revogada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked:
                        type: boolean
                    example:
                      revoked: true
                  meta:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      page:
                        type: number
                      pageSize:
                        type: number
                      total:
                        type: number
                required:
                  - data
                  - meta
                example:
                  data:
                    revoked: true
                  meta:
                    correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
              example:
                data:
                  revoked: true
                meta:
                  correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
        '201':
          description: Recurso criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked:
                        type: boolean
                    example:
                      revoked: true
                  meta:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      page:
                        type: number
                      pageSize:
                        type: number
                      total:
                        type: number
                required:
                  - data
                  - meta
                example:
                  data:
                    revoked: true
                  meta:
                    correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
              example:
                data:
                  revoked: true
                meta:
                  correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
        '400':
          description: Requisição inválida (validação Zod ou regra de domínio)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
              example:
                code: VALIDATION_ERROR
                message: Requisição inválida (validação Zod ou regra de domínio)
                details:
                  - path: weight
                    message: Peso deve ser maior que zero
                correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
        '401':
          description: Não autenticado — accessToken em falta, expirado ou revogado (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
              example:
                code: UNAUTHENTICATED
                message: Token em falta
                details: []
                correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
        '403':
          description: >-
            Sem permissão para este recurso — role insuficiente (FORBIDDEN) ou recurso pertence a outro utilizador
            (verificação de posse)
