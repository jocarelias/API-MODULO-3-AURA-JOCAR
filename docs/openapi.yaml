            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
              example:
                code: FORBIDDEN
                message: Só tem permissão para aceder aos seus próprios dados
                details: []
                correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
        '404':
          description: Recurso inexistente (NOT_FOUND)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
              example:
                code: NOT_FOUND
                message: Recurso não encontrado
                details: []
                correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
        '409':
          description: Conflito (duplicação, sobreposição de horário, avaliação com notas já lançadas)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
              example:
                code: CONFLICT
                message: Conflito de domínio
                details: []
                correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
        '500':
          description: Erro interno do servidor (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
