openapi: 3.0.0
info:
  title: Smart Campos — Módulo G3 (Avaliações e Horários)
  version: 1.0.0
  description: >-
    API autenticada (Bearer) para gestão de avaliações, notas, médias, horários, resultados e impressão de pautas/horários. Consome os serviços de contratos (estudantes, docentes, inscrições e
    financeiro) e bloqueia o lançamento de notas de alunos com dívida.
security:
  - BearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Autenticação
      summary: Autentica um utilizador e devolve um token de acesso
      description: Público. Verifica credenciais e devolve um accessToken (Bearer, TTL 3600s).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Credenciais válidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                      expiresIn:
                        type: integer
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          role:
                            type: string
                          schoolId:
                            type: string
                            format: uuid
                          name:
                            type: string
                          email:
                            type: string
                  meta:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      page:
                        type: number
                      pageSize:
                        type: number
                      total:
                        type: number
                required:
                  - data
                  - meta
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
        '401':
          description: Credenciais inválidas ou utilizador inativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
      security: []
  /api/v1/results/calculation-methods:
    get:
      tags:
        - Resultados
      summary: Lista os métodos de cálculo disponíveis
      description: Retorna os 6 métodos de cálculo suportados pelo motor académico.
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - ARITHMETIC_MEAN
                            - WEIGHTED_PERCENTAGE
                            - PERCENTAGE_SUM
                            - NORMALIZED_WEIGHTED_MEAN
                            - COMPONENT_BASED
                            - CUSTOM_WEIGHTED
                        name:
                          type: string
                        description:
                          type: string
                        formula:
                          type: string
                  meta:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      page:
                        type: number
                      pageSize:
                        type: number
                      total:
                        type: number
                required:
                  - data
                  - meta
        '201':
          description: Recurso criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - ARITHMETIC_MEAN
                            - WEIGHTED_PERCENTAGE
                            - PERCENTAGE_SUM
                            - NORMALIZED_WEIGHTED_MEAN
                            - COMPONENT_BASED
                            - CUSTOM_WEIGHTED
                        name:
                          type: string
                        description:
                          type: string
                        formula:
                          type: string
                  meta:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      page:
                        type: number
                      pageSize:
                        type: number
                      total:
                        type: number
                required:
                  - data
                  - meta
        '400':
          description: Requisição inválida (validação Zod ou regra de domínio)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
        '401':
          description: Não autenticado — token em falta ou inválido (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
        '404':
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
        '409':
          description: Conflito (duplicação, horário, bloqueio por notas)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
  /api/v1/results/calculate:
    post:
      tags:
        - Resultados
      summary: Calcula a nota final usando um método de cálculo flexível
      description: 'Motor multi-método: permite escolher entre média aritmética, ponderada percentual, soma percentual, média normalizada, cálculo por componentes ou cálculo personalizado.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
                - items
              properties:
                method:
                  type: string
                  enum:
                    - ARITHMETIC_MEAN
                    - WEIGHTED_PERCENTAGE
                    - PERCENTAGE_SUM
                    - NORMALIZED_WEIGHTED_MEAN
                    - COMPONENT_BASED
                    - CUSTOM_WEIGHTED
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - score
                    properties:
                      assessmentId:
                        type: string
                        format: uuid
                        description: UUID da avaliação (opcional)
                      name:
                        type: string
                        minLength: 1
                      type:
                        type: string
                        enum:
                          - TESTE
                          - EXAME_NORMAL
                          - EXAME_RECURRENCIA
                      score:
                        type: number
                        minimum: 0
                      weight:
                        type: number
                        minimum: 0
                        maximum: 100
                        description: Peso percentual (0–100)
                  minLength: 1
                  description: Notas com pesos (mínimo 1 item)
                components:
                  type: array
                  items:
                    type: object
                    required:
                      - weight
                    properties:
                      id:
                        type: string
                        minLength: 1
                      assessmentId:
                        type: string
                        format: uuid
                      name:
                        type: string
                        minLength: 1
                      weight:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 100
                      score:
                        type: number
                        minimum: 0
                        description: Nota (obrigatória nos nós-folha)
                      children:
                        type: array
                        items:
                          type: object
                        description: Sub-componentes (nível interno)
                  minLength: 1
                  description: Obrigatório para COMPONENT_BASED
                formula:
                  type: string
                  minLength: 1
                  description: Código da fórmula registada (obrigatório para CUSTOM_WEIGHTED)
                rounding:
                  type: object
                  properties:
                    decimals:
                      type: integer
                      enum:
                        - 0
                        - 1
                        - 2
                  description: Precisão de arredondamento (0, 1 ou 2 casas decimais)
                minScore:
                  type: number
                  minimum: 0
                  description: Nota mínima do intervalo (padrão 0)
                maxScore:
                  type: number
                  minimum: 1
                  description: Nota máxima do intervalo (padrão 20)
                expectedTotal:
                  type: number
                  exclusiveMinimum: 0
                  description: Total esperado dos pesos (padrão 100)
                allowNormalization:
                  type: boolean
                  description: Permitir normalização de pesos
                top:
                  type: integer
                  minimum: 1
                  description: Número de melhores notas para MEAN_OF_TOP_K
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      method:
                        type: string
                        enum:
                          - ARITHMETIC_MEAN
                          - WEIGHTED_PERCENTAGE
                          - PERCENTAGE_SUM
                          - NORMALIZED_WEIGHTED_MEAN
                          - COMPONENT_BASED
                          - CUSTOM_WEIGHTED
                      value:
                        type: number
                      decimals:
                        type: integer
                      formula:
                        type: string
                        nullable: true
                      breakdown:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            assessmentId:
                              type: string
                              format: uuid
                            name:
                              type: string
                            type:
                              type: string
                              enum:
                                - TESTE
                                - EXAME_NORMAL
                                - EXAME_RECURRENCIA
                            label:
                              type: string
                            score:
                              type: number
                            weight:
                              type: number
                              nullable: true
                            normalizedWeight:
                              type: number
                              nullable: true
                            contribution:
                              type: number
                              nullable: true
                            children:
                              type: array
                              items:
                                type: object
                  meta:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      page:
                        type: number
                      pageSize:
                        type: number
                      total:
                        type: number
                required:
                  - data
                  - meta
        '201':
          description: Recurso criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      method:
                        type: string
                        enum:
                          - ARITHMETIC_MEAN
                          - WEIGHTED_PERCENTAGE
                          - PERCENTAGE_SUM
                          - NORMALIZED_WEIGHTED_MEAN
                          - COMPONENT_BASED
                          - CUSTOM_WEIGHTED
                      value:
                        type: number
                      decimals:
                        type: integer
                      formula:
                        type: string
                        nullable: true
                      breakdown:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            assessmentId:
                              type: string
                              format: uuid
                            name:
                              type: string
                            type:
                              type: string
                              enum:
                                - TESTE
                                - EXAME_NORMAL
                                - EXAME_RECURRENCIA
                            label:
                              type: string
                            score:
                              type: number
                            weight:
                              type: number
                              nullable: true
                            normalizedWeight:
                              type: number
                              nullable: true
                            contribution:
                              type: number
                              nullable: true
                            children:
                              type: array
                              items:
                                type: object
                  meta:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      page:
                        type: number
                      pageSize:
                        type: number
                      total:
                        type: number
                required:
                  - data
                  - meta
        '400':
          description: Requisição inválida (validação Zod ou regra de domínio)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
        '401':
          description: Não autenticado — token em falta ou inválido (UNAUTHENTICATED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
        '404':
          description: Recurso não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
        '409':
          description: Conflito (duplicação, horário, bloqueio por notas)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  correlationId:
                    type: string
  /api/v1/assessments:
