      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - ARITHMETIC_MEAN
                            - WEIGHTED_PERCENTAGE
                            - PERCENTAGE_SUM
                            - NORMALIZED_WEIGHTED_MEAN
                            - COMPONENT_BASED
                            - CUSTOM_WEIGHTED
                        name:
                          type: string
                        description:
                          type: string
                        formula:
                          type: string
                      example:
                        code: WEIGHTED_PERCENTAGE
                        name: Média ponderada por percentagem
                        description: Soma as notas ponderadas pela percentagem de cada componente e divide pelo total.
                        formula: Σ (nota × peso) ÷ Σ pesos
                  meta:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      page:
                        type: number
                      pageSize:
                        type: number
                      total:
                        type: number
                required:
                  - data
                  - meta
                example:
                  data:
                    - code: WEIGHTED_PERCENTAGE
                      name: Média ponderada por percentagem
                      description: Soma as notas ponderadas pela percentagem de cada componente e divide pelo total.
                      formula: Σ (nota × peso) ÷ Σ pesos
                  meta:
                    correlationId: 3f7c1b52-9a4e-4d18-8b6f-2e5a9c7d1e04
                    page: 1
                    pageSize: 20
                    total: 3
              example:
                data:
