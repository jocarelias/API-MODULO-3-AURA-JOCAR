<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Arial, Helvetica, sans-serif">
  <rect width="1180" height="760" fill="#ffffff"/>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#1f4e79">UML de Classes — Módulo G3 (JavaScript, separação por camadas)</text>

  <!-- Router -->
  <g>
    <rect x="360" y="60" width="420" height="150" fill="#ffffff" stroke="#2e74b5" rx="6"/>
    <rect x="360" y="60" width="420" height="26" fill="#1f4e79" rx="6"/><rect x="360" y="76" width="420" height="10" fill="#1f4e79"/>
    <text x="372" y="78" font-size="12" font-weight="bold" fill="#ffffff">http/schedulesAssessmentsRouter.js</text>
    <text x="372" y="104" font-size="11" fill="#1a1a1a">«HTTP» createSchedulesAssessmentsRouter() : Router</text>
    <text x="372" y="122" font-size="11" fill="#1a1a1a">rotas /api/v1/assessments · /schedules · /results</text>
    <text x="372" y="140" font-size="11" fill="#1a1a1a">correlationId (x-request-id | randomUUID())</text>
    <text x="372" y="158" font-size="11" fill="#1a1a1a">envelope: {data, meta} | erro {code, message, details}</text>
    <text x="372" y="176" font-size="11" fill="#1a1a1a">404 fallback do módulo</text>
    <text x="372" y="196" font-size="10.5" fill="#777">status: 201 · 200 · 400 · 404 · 409 · 500 (nunca 401/403)</text>
  </g>

  <!-- Schemas Zod -->
  <g>
    <rect x="40" y="60" width="250" height="150" fill="#ffffff" stroke="#2e74b5" rx="6"/>
    <rect x="40" y="60" width="250" height="26" fill="#1f4e79" rx="6"/><rect x="40" y="76" width="250" height="10" fill="#1f4e79"/>
    <text x="52" y="78" font-size="11.5" font-weight="bold" fill="#ffffff">schemas/* (Zod 3)</text>
    <text x="52" y="102" font-size="10.5" fill="#1a1a1a">create/update/query/params:</text>
    <text x="52" y="118" font-size="10.5" fill="#1a1a1a">Assessment · Grade</text>
    <text x="52" y="134" font-size="10.5" fill="#1a1a1a">Schedule · Result</text>
    <text x="52" y="152" font-size="10.5" fill="#1a1a1a">uuid() · enum() · datetime()</text>
    <text x="52" y="170" font-size="10.5" fill="#1a1a1a">weight &gt; 0 · score ≥ 0</text>
    <text x="52" y="188" font-size="10.5" fill="#777">re-exportado por @smartcampus/validation</text>
  </g>

  <!-- httpError -->
  <g>
    <rect x="820" y="60" width="300" height="150" fill="#ffffff" stroke="#2e74b5" rx="6"/>
    <rect x="820" y="60" width="300" height="26" fill="#1f4e79" rx="6"/><rect x="820" y="76" width="300" height="10" fill="#1f4e79"/>
    <text x="832" y="78" font-size="11.5" font-weight="bold" fill="#ffffff">infrastructure/httpError.js</text>
    <text x="832" y="102" font-size="10.5" fill="#1a1a1a">toHttpError(error, correlationId)</text>
    <text x="832" y="120" font-size="10.5" fill="#1a1a1a">DomainError → httpStatus</text>
    <text x="832" y="138" font-size="10.5" fill="#1a1a1a">Prisma P2002 → 409</text>
    <text x="832" y="156" font-size="10.5" fill="#1a1a1a">express status → 400</text>
    <text x="832" y="174" font-size="10.5" fill="#1a1a1a">fallback → 500 INTERNAL_ERROR</text>
    <text x="832" y="194" font-size="10.5" fill="#777">infrastructure/prisma.js — singleton</text>
  </g>

  <!-- Service -->
  <g>
    <rect x="300" y="330" width="540" height="220" fill="#ffffff" stroke="#2e74b5" rx="6"/>
    <rect x="300" y="330" width="540" height="26" fill="#1f4e79" rx="6"/><rect x="300" y="346" width="540" height="10" fill="#1f4e79"/>
    <text x="312" y="348" font-size="12" font-weight="bold" fill="#ffffff">application/schedulesAssessmentsService.js</text>
    <text x="312" y="374" font-size="11" fill="#1a1a1a">listAssessments · getAssessment · createAssessment · updateAssessment · deleteAssessment</text>
    <text x="312" y="392" font-size="11" fill="#1a1a1a">listGrades · createGrade · updateGrade</text>
    <text x="312" y="410" font-size="11" fill="#1a1a1a">listSchedules · createSchedule · updateSchedule · deleteSchedule</text>
    <text x="312" y="428" font-size="11" fill="#1a1a1a">listResults · getResult · createResults · patchResult</text>
    <text x="312" y="446" font-size="11" fill="#1a1a1a">getPrintClassSchedule · getPrintClassPauta</text>
    <text x="312" y="470" font-size="11" fill="#1a1a1a">_recalculateInTx(tx, assessment, studentIds) — média + status</text>
    <text x="312" y="488" font-size="11" fill="#1a1a1a">findConflicts(...) — professor/turma/sala</text>
    <text x="312" y="506" font-size="11" fill="#c00000">DomainError { code, httpStatus, details }</text>
    <text x="312" y="524" font-size="10.5" fill="#777">$transaction em createGrade/updateGrade/createResults/patchResult (ACID)</text>
    <text x="312" y="540" font-size="10.5" fill="#777">TYPE_MAP: TESTE→TEST · EXAME_*→EXAM</text>
  </g>

  <!-- Domain -->
  <g>
    <rect x="40" y="330" width="240" height="210" fill="#ffffff" stroke="#2e74b5" rx="6"/>
    <rect x="40" y="330" width="240" height="26" fill="#1f4e79" rx="6"/><rect x="40" y="346" width="240" height="10" fill="#1f4e79"/>
    <text x="52" y="348" font-size="11.5" font-weight="bold" fill="#ffffff">domain/evaluation.js</text>
    <text x="52" y="374" font-size="10.5" fill="#1a1a1a">«funções puras (sem IO)»</text>
    <text x="52" y="392" font-size="10.5" fill="#1a1a1a">validateEvaluationType(type)</text>
    <text x="52" y="410" font-size="10.5" fill="#1a1a1a">validateWeight(weight) — peso &gt; 0</text>
    <text x="52" y="428" font-size="10.5" fill="#1a1a1a">validateScore(score, max)</text>
    <text x="52" y="446" font-size="10.5" fill="#1a1a1a">validateTimeRange(start, end)</text>
    <text x="52" y="464" font-size="10.5" fill="#1a1a1a">weightedAverage(grades)</text>
    <text x="52" y="482" font-size="10.5" fill="#1a1a1a">resolveResultStatus(...)</text>
    <text x="52" y="500" font-size="10.5" fill="#1a1a1a">constantes: PASSING=10, RECOVERY=8</text>
    <text x="52" y="526" font-size="10.5" fill="#777">21 testes unitários sem banco</text>
  </g>

  <!-- Prisma DB -->
  <g>
    <rect x="880" y="330" width="220" height="140" fill="#ffffff" stroke="#2e74b5" rx="6"/>
    <rect x="880" y="330" width="220" height="26" fill="#1f4e79" rx="6"/><rect x="880" y="346" width="220" height="10" fill="#1f4e79"/>
    <text x="892" y="348" font-size="11.5" font-weight="bold" fill="#ffffff">Prisma Client 6 + PostgreSQL</text>
    <text x="892" y="374" font-size="10.5" fill="#1a1a1a">assessment · grade · schedule · result</text>
    <text x="892" y="392" font-size="10.5" fill="#1a1a1a">$transaction(async tx =&gt; ...)</text>
    <text x="892" y="410" font-size="10.5" fill="#1a1a1a">upsert result (unique composto)</text>
    <text x="892" y="428" font-size="10.5" fill="#1a1a1a">CHECK constraints no banco</text>
    <text x="892" y="452" font-size="10.5" fill="#777">PostgreSQL 16 · localhost:5434</text>
  </g>

  <!-- shared-types -->
  <g>
    <rect x="40" y="640" width="1000" height="70" fill="#ffffff" stroke="#2e74b5" rx="6"/>
    <rect x="40" y="640" width="1000" height="26" fill="#1f4e79" rx="6"/><rect x="40" y="656" width="1000" height="10" fill="#1f4e79"/>
    <text x="52" y="658" font-size="12" font-weight="bold" fill="#ffffff">packages/@smartcampus (workspaces) — partilhado</text>
    <text x="52" y="684" font-size="11" fill="#1a1a1a">shared-types: assessmentDto · gradeDto · scheduleDto · resultDto · constantes · campusModules.G3_AVALIACOES_HORARIOS</text>
    <text x="52" y="702" font-size="11" fill="#1a1a1a">validation: re-exporta schemas do módulo (fonte única) · api-client: SmartCampusApiClient (fetch, Node 24)</text>
  </g>

  <!-- associations -->
  <g stroke="#404040" stroke-width="1.4" font-size="10.5" fill="#404040">
    <line x1="290" y1="135" x2="358" y2="135"/><polygon points="358,135 348,130 348,140" fill="#404040"/><text x="310" y="126">valida</text>
    <line x1="780" y1="135" x2="818" y2="135"/><polygon points="818,135 808,130 808,140" fill="#404040"/><text x="788" y="126">mapeia erros</text>
    <line x1="570" y1="210" x2="570" y2="328"/><polygon points="570,328 560,318 580,318" fill="#404040"/><text x="578" y="274">invoca casos de uso</text>
    <line x1="540" y1="222" x2="400" y2="328"/><polygon points="400,328 410,318 410,338" fill="#404040"/><text x="452" y="240">usa schemas</text>
    <line x1="160" y1="410" x2="298" y2="430"/><polygon points="298,430 288,420 288,440" fill="#404040"/><text x="200" y="398">usa regras puras</text>
    <line x1="840" y1="402" x2="878" y2="398"/><polygon points="878,398 866,393 866,403" fill="#404040"/><text x="850" y="388">persistência</text>
    <line x1="570" y1="550" x2="570" y2="638"/><polygon points="570,638 560,628 580,628" fill="#404040"/><text x="578" y="600">serializa DTOs</text>
  </g>
</svg>