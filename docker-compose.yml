services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-campos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartcampos
      POSTGRES_PASSWORD: smartcampos
      POSTGRES_DB: smartcampos
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampos -d smartcampos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: